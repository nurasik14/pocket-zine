<svg xmlns="http://www.w3.org/2000/svg" width="297.0mm" height="210.0mm" viewBox="0 0 297.0 210.0"><rect width="297.0" height="210.0" fill="#fff"/><text x="15.00" y="22.00" font-family="'EB Garamond','Noto Serif CJK TC','Noto Serif',serif" font-size="7.056" font-weight="600" fill="#2b2622" text-anchor="start" letter-spacing="0" opacity="1">How to fold the 8-page zine</text><text x="15.00" y="30.00" font-family="'Noto Serif CJK TC','Noto Serif CJK HK',serif" font-size="3.881" font-weight="400" fill="#9c3b2e" text-anchor="start" letter-spacing="0" opacity="1">一張紙摺成八頁小誌</text><text x="15.00" y="45.00" font-family="'EB Garamond','Noto Serif CJK TC','Noto Serif',serif" font-size="3.528" font-weight="400" fill="#2b2622" text-anchor="start" letter-spacing="0" opacity="1">1. Print the sheet at 100% / “Actual size” (not “Fit to page”), landscape, one-sided.</text><text x="15.00" y="52.50" font-family="'EB Garamond','Noto Serif CJK TC','Noto Serif',serif" font-size="3.528" font-weight="400" fill="#2b2622" text-anchor="start" letter-spacing="0" opacity="1">2. Fold it in half the long way (top edge to bottom edge), crease, unfold.</text><text x="15.00" y="60.00" font-family="'EB Garamond','Noto Serif CJK TC','Noto Serif',serif" font-size="3.528" font-weight="400" fill="#2b2622" text-anchor="start" letter-spacing="0" opacity="1">3. Fold it in half the short way, crease, unfold. Then fold each half again to the middle: 8 panels.</text><text x="15.00" y="67.50" font-family="'EB Garamond','Noto Serif CJK TC','Noto Serif',serif" font-size="3.528" font-weight="400" fill="#2b2622" text-anchor="start" letter-spacing="0" opacity="1">4. Fold it in half the long way again. Cut along the middle crease, ONLY across the two centre panels (red line).</text><text x="15.00" y="75.00" font-family="'EB Garamond','Noto Serif CJK TC','Noto Serif',serif" font-size="3.528" font-weight="400" fill="#2b2622" text-anchor="start" letter-spacing="0" opacity="1">5. Open it, fold long-ways again, and push the ends together so the cut opens into a diamond / plus shape.</text><text x="15.00" y="82.50" font-family="'EB Garamond','Noto Serif CJK TC','Noto Serif',serif" font-size="3.528" font-weight="400" fill="#2b2622" text-anchor="start" letter-spacing="0" opacity="1">6. Flatten it into a booklet, front cover (page 1) on the outside. Crease all edges firmly.</text><text x="15.00" y="97.50" font-family="'EB Garamond','Noto Serif CJK TC','Noto Serif',serif" font-size="3.528" font-weight="400" fill="#8a8178" text-anchor="start" letter-spacing="0" opacity="1">Why the top row is upside down: when you fold, those pages turn over and end up the right way up.</text><text x="15.00" y="105.00" font-family="'EB Garamond','Noto Serif CJK TC','Noto Serif',serif" font-size="3.528" font-weight="400" fill="#8a8178" text-anchor="start" letter-spacing="0" opacity="1">Tip: phone photos with EXIF rotation are fixed by zine.py automatically.</text><text x="15.00" y="112.50" font-family="'EB Garamond','Noto Serif CJK TC','Noto Serif',serif" font-size="3.528" font-weight="400" fill="#8a8178" text-anchor="start" letter-spacing="0" opacity="1">Tip: home printers can&#x27;t print the last ~4 mm at the edges; full-page photos get a thin white rim there. That&#x27;s normal.</text><rect x="15.0" y="128.0" width="35.0" height="35.0" fill="#faf8f4" stroke="#8a8178" stroke-width="0.3"/><g transform="translate(32.5,145.5) rotate(180)"><text x="0.00" y="2.50" font-family="'EB Garamond','Noto Serif CJK TC','Noto Serif',serif" font-size="3.881" font-weight="600" fill="#2b2622" text-anchor="middle" letter-spacing="0" opacity="1">5</text></g><rect x="50.0" y="128.0" width="35.0" height="35.0" fill="#faf8f4" stroke="#8a8178" stroke-width="0.3"/><g transform="translate(67.5,145.5) rotate(180)"><text x="0.00" y="2.50" font-family="'EB Garamond','Noto Serif CJK TC','Noto Serif',serif" font-size="3.881" font-weight="600" fill="#2b2622" text-anchor="middle" letter-spacing="0" opacity="1">4</text></g><rect x="85.0" y="128.0" width="35.0" height="35.0" fill="#faf8f4" stroke="#8a8178" stroke-width="0.3"/><g transform="translate(102.5,145.5) rotate(180)"><text x="0.00" y="2.50" font-family="'EB Garamond','Noto Serif CJK TC','Noto Serif',serif" font-size="3.881" font-weight="600" fill="#2b2622" text-anchor="middle" letter-spacing="0" opacity="1">3</text></g><rect x="120.0" y="128.0" width="35.0" height="35.0" fill="#faf8f4" stroke="#8a8178" stroke-width="0.3"/><g transform="translate(137.5,145.5) rotate(180)"><text x="0.00" y="2.50" font-family="'EB Garamond','Noto Serif CJK TC','Noto Serif',serif" font-size="3.881" font-weight="600" fill="#2b2622" text-anchor="middle" letter-spacing="0" opacity="1">2</text></g><rect x="15.0" y="163.0" width="35.0" height="35.0" fill="#faf8f4" stroke="#8a8178" stroke-width="0.3"/><text x="32.50" y="183.00" font-family="'EB Garamond','Noto Serif CJK TC','Noto Serif',serif" font-size="3.881" font-weight="600" fill="#2b2622" text-anchor="middle" letter-spacing="0" opacity="1">6</text><rect x="50.0" y="163.0" width="35.0" height="35.0" fill="#faf8f4" stroke="#8a8178" stroke-width="0.3"/><text x="67.50" y="183.00" font-family="'EB Garamond','Noto Serif CJK TC','Noto Serif',serif" font-size="3.881" font-weight="600" fill="#2b2622" text-anchor="middle" letter-spacing="0" opacity="1">7</text><rect x="85.0" y="163.0" width="35.0" height="35.0" fill="#faf8f4" stroke="#8a8178" stroke-width="0.3"/><text x="102.50" y="183.00" font-family="'EB Garamond','Noto Serif CJK TC','Noto Serif',serif" font-size="3.881" font-weight="600" fill="#2b2622" text-anchor="middle" letter-spacing="0" opacity="1">8 back</text><rect x="120.0" y="163.0" width="35.0" height="35.0" fill="#faf8f4" stroke="#8a8178" stroke-width="0.3"/><text x="137.50" y="183.00" font-family="'EB Garamond','Noto Serif CJK TC','Noto Serif',serif" font-size="3.881" font-weight="600" fill="#2b2622" text-anchor="middle" letter-spacing="0" opacity="1">1 front</text><line x1="50.0" y1="163.0" x2="120.0" y2="163.0" stroke="#9c3b2e" stroke-width="0.8"/><text x="85.00" y="205.00" font-family="'EB Garamond','Noto Serif CJK TC','Noto Serif',serif" font-size="2.822" font-weight="400" fill="#9c3b2e" text-anchor="middle" letter-spacing="0" opacity="1">red = the only cut. Top row prints upside down on purpose.</text><text x="170.00" y="140.00" font-family="'EB Garamond','Noto Serif CJK TC','Noto Serif',serif" font-size="3.528" font-weight="600" fill="#2b2622" text-anchor="start" letter-spacing="0" opacity="1">Reading order after folding:</text><text x="170.00" y="148.00" font-family="'EB Garamond','Noto Serif CJK TC','Noto Serif',serif" font-size="3.175" font-weight="400" fill="#2b2622" text-anchor="start" letter-spacing="0" opacity="1">1 front cover → 2 → 3 → 4 → 5 → 6 → 7 → 8 back cover</text></svg>