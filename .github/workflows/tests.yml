name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build blank templates end to end
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin poppler-utils fonts-noto-cjk
          python zine.py blank -o "$RUNNER_TEMP/templates"
          test -s "$RUNNER_TEMP/templates/ALL_templates.pdf"
